name: Model-based filesystem harness
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SAQTA_HARNESS_CASES: '5000'
      PROPTEST_MAX_SHRINK_ITERS: '20000'
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Run the harness
        run: |
          mkdir -p target
          set -o pipefail
          cargo test --locked --test harness -- --nocapture 2>&1 | tee target/harness-nightly.log
      - name: Keep failing seeds, syscall results and fixtures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-failure-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            tests/harness.proptest-regressions
            target/harness-nightly.log
            target/saqta-tests/harness-*/
