name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Bulk restore without synchronous wakeups on two CPUs
        run: taskset -c 0,1 env SAQTA_NO_SYNC_WAKE=1 cargo test --locked --test codex separate_bind_mount_five_thousand_deletes_restore -- --exact --nocapture --test-threads=1
      - name: Verify timeout diagnostics on two CPUs
        run: taskset -c 0,1 env SAQTA_NO_SYNC_WAKE=1 cargo test --locked --test timeouts -- --test-threads=1
      - run: cargo test --locked --test capture
        env:
          SAQTA_FORCE_PROC_MEM: '1'
      - run: cargo run --locked -- doctor
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check licenses bans advisories
      - name: Keep timeout diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: timeout-diagnostics-${{ matrix.os }}-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: target/saqta-tests/**/logs/timeout-*.log
